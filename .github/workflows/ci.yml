name: Geo CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and verify dependency backport
        run: npm ci

      - name: Lint, unit and data tests, publication guard, and Pages build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production Chromium E2E
        run: npm run test:e2e

      - name: Development root-path Chromium matrix
        env:
          GEO_MATRIX_DEV: '1'
        run: npm run test:e2e:matrix -- --project=chromium

      - name: Optimized dependency attribution canaries
        run: npm run test:security:dev

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
